              - column: { name: regn_nm, value: Asia Pacific }
              - column: { name: is_actv, valueBoolean: true }
              - column: { name: srt_ord, valueNumeric: 40 }

  - changeSet:
      id: 0002-02-seed-tlkp-countries
      author: cddp
