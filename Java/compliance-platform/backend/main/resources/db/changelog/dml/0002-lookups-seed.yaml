        - insert:
            tableName: tlkp_countries
            columns:
              - column: { name: ctry_cd, value: US }
              - column: { name: code_alpha3, value: USA }
              - column: { name: name, value: United States }
              - column: { name: numerc_cd, value: "840" }
              - column: { name: regn_cd, value: NA }
              - column: { name: risk_rtg, value: LOW }
        - insert:
            tableName: tlkp_countries
            columns:
              - column: { name: ctry_cd, value: CA }
              - column: { name: code_alpha3, value: CAN }
