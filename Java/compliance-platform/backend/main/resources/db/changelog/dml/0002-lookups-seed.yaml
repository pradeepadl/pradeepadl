              - column: { name: risk_rtg, value: LOW }
        - insert:
            tableName: tlkp_countries
            columns:
              - column: { name: ctry_cd, value: MX }
              - column: { name: code_alpha3, value: MEX }
              - column: { name: name, value: Mexico }
              - column: { name: numerc_cd, value: "484" }
