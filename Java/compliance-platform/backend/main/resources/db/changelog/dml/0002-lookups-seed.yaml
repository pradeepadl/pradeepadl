databaseChangeLog:
  - changeSet:
      id: 0002-01-seed-tlkp-regions
      author: cddp
      changes:
        - insert:
            tableName: tlkp_regions
            columns:
              - column: { name: regn_cd, value: NA }
              - column: { name: regn_nm, value: North America }
              - column: { name: is_actv, valueBoolean: true }
              - column: { name: srt_ord, valueNumeric: 10 }
        - insert:
            tableName: tlkp_regions
            columns:
              - column: { name: regn_cd, value: LATAM }
              - column: { name: regn_nm, value: Latin America & Caribbean }
              - column: { name: is_actv, valueBoolean: true }
              - column: { name: srt_ord, valueNumeric: 20 }
        - insert:
            tableName: tlkp_regions
            columns:
              - column: { name: regn_cd, value: EMEA }
              - column: { name: regn_nm, value: "Europe, Middle East & Africa" }
              - column: { name: is_actv, valueBoolean: true }
              - column: { name: srt_ord, valueNumeric: 30 }
        - insert:
            tableName: tlkp_regions
            columns:
