databaseChangeLog:
  - changeSet:
      id: 0005-01-create-tmstr-parties
      author: cddp
      changes:
        - createTable:
            tableName: tmstr_parties
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tmstr_parties_tenant
                    references: tmstr_tenants(id)
              - column:
                  name: prty_typ
                  type: party_type
                  constraints:
                    nullable: false
              - column:
                  name: is_actv
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: extrnl_refnc_id
                  type: VARCHAR(100)
              - column:
                  name: srce_sys
                  type: VARCHAR(30)
              - column:
                  name: ver
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: deld_ts
                  type: TIMESTAMP
              - column:
                  name: crtd_ts
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: crtd_nm
                  type: VARCHAR(100)
              - column:
                  name: last_updd_ts
                  type: TIMESTAMP
              - column:
                  name: last_updd_nm
                  type: VARCHAR(100)
        - createIndex:
            indexName: ix_tmstr_parties_tenant_id
            tableName: tmstr_parties
            columns:
              - column:
                  name: tenant_id

  - changeSet:
      id: 0005-02-create-tsub-individual-details
      author: cddp
      comment: 1:1 subtype of tmstr_parties — PK is the FK, no surrogate key.
      changes:
        - createTable:
            tableName: tsub_individual_details
            columns:
              - column:
                  name: prty_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_tsub_individual_details_prty
                    references: tmstr_parties(id)
              - column:
                  name: sltn
                  type: VARCHAR(10)
              - column:
                  name: first_nm
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: mid_nm
                  type: VARCHAR(100)
              - column:
                  name: last_nm
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: dob
                  type: DATE
              - column:
                  name: gndr
                  type: VARCHAR(10)
              - column:
                  name: ntlty
                  type: VARCHAR(60)
              - column:
                  name: citizenship
                  type: VARCHAR(60)
              - column:
                  name: is_pep
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_sanctnd
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 0005-03-create-tsub-organization-details
      author: cddp
      comment: 1:1 subtype of tmstr_parties — PK is the FK, no surrogate key.
      changes:
        - createTable:
            tableName: tsub_organization_details
            columns:
              - column:
                  name: prty_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_tsub_organization_details_prty
                    references: tmstr_parties(id)
              - column:
                  name: enty_typ
                  type: VARCHAR(50)
              - column:
                  name: is_pep
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_sve
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_sdn_mnrty
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: inc_ctry
                  type: CHAR(2)
                  constraints:
                    foreignKeyName: fk_tsub_organization_details_ctry
                    references: tlkp_countries(ctry_cd)

  - changeSet:
      id: 0005-04-create-tsub-party-names
      author: cddp
      changes:
        - createTable:
            tableName: tsub_party_names
            columns:
              - column:
