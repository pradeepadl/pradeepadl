  - changeSet:
      id: 0005-08-create-trel-party-relationships
      author: cddp
      comment: >
        root_clnt_id intentionally has no FK yet — TSUB_CLIENT_DETAILS
        doesn't exist until 0006-client.yaml, which adds the constraint via
        a deferred ALTER TABLE once the target table is in place.
      changes:
        - createTable:
            tableName: trel_party_relationships
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trel_party_rel_tenant
                    references: tmstr_tenants(id)
              - column:
                  name: root_clnt_id
                  type: UUID
              - column:
                  name: subs_prty_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trel_party_rel_subs_prty
                    references: tmstr_parties(id)
              - column:
                  name: reld_prty_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trel_party_rel_reld_prty
                    references: tmstr_parties(id)
              - column:
                  name: relnshp_typ_cd
                  type: VARCHAR(30)
                  constraints:
                    foreignKeyName: fk_trel_party_rel_typ
                    references: tlkp_relnshp_type(cd)
              - column:
                  name: ownrshp_pct
                  type: DECIMAL(5,2)
              - column:
                  name: ttl
                  type: VARCHAR(100)
              - column:
                  name: depth_lvl
                  type: SMALLINT
              - column:
                  name: is_circular_flgd
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: eff_from
                  type: DATE
              - column:
                  name: eff_to
                  type: DATE
              - column:
                  name: is_scmd
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: last_scmd_at
                  type: TIMESTAMP
              - column:
                  name: ver
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: ix_trel_party_rel_root_clnt_id
            tableName: trel_party_relationships
            columns:
              - column:
                  name: root_clnt_id
        - createIndex:
            indexName: ix_trel_party_rel_subs_prty_id
            tableName: trel_party_relationships
            columns:
              - column:
                  name: subs_prty_id
        - createIndex:
            indexName: ix_trel_party_rel_reld_prty_id
            tableName: trel_party_relationships
            columns:
              - column:
                  name: reld_prty_id