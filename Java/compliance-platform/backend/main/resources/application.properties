spring.application.name=demo

# LDAP isn't wired up to anything yet (no compose service, no config beyond
# the starter dependency), so the auto-configured health indicator just
# fails against localhost:389 and drags down /actuator/health. Re-enable
# once an LDAP server is actually in the picture.
management.health.ldap.enabled=false

# Liquibase owns the schema (see db/changelog/db.changelog-master.yaml,
# which composes the ddl/ and dml/ changeset folders). This is already the
# Spring Boot default path — spelled out here so it's not implicit.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Hibernate must not also try to manage the schema now that Liquibase does;
# `validate` just checks entity mappings against what Liquibase created,
# it never issues DDL itself.
spring.jpa.hibernate.ddl-auto=validate
