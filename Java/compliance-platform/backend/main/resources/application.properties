spring.application.name=demo

# LDAP isn't wired up to anything yet (no compose service, no config beyond
# the starter dependency), so the auto-configured health indicator just
# fails against localhost:389 and drags down /actuator/health. Re-enable
# once an LDAP server is actually in the picture.
management.health.ldap.enabled=false

# Liquibase owns the schema (see db/changelog/db.changelog-master.yaml,
# which composes the ddl/ and dml/ changeset folders). This is already the
# Spring Boot default path — spelled out here so it's not implicit.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Hibernate must not also try to manage the schema now that Liquibase does;
# `validate` just checks entity mappings against what Liquibase created,
# it never issues DDL itself.
spring.jpa.hibernate.ddl-auto=validate

# ── Auth (see com.cddp.config.SecurityConfig) ───────────────────────────────
#
# Registering at least one OAuth2 client here is what activates Spring
# Boot's Authorization Server auto-configuration (Boot backs off entirely
# otherwise) — this is the client-credentials client the Python AI agent
# service authenticates as (pySDK/sdk/cddp_ai_sdk/auth/java_token_cache.py
# POSTs to /oauth2/token with HTTP Basic client auth). {noop} marks the
# secret as plaintext for Spring Security's DelegatingPasswordEncoder —
# fine for this dev-only demo client; a real deployment should store a
# pre-hashed {bcrypt} secret instead and never default it in a properties
# file the way this does.
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.registration.client-id=ai-kyc-agent
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.registration.client-secret={noop}${AI_KYC_AGENT_CLIENT_SECRET:ai-kyc-agent-dev-secret}
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.registration.scopes=internal.read
spring.security.oauth2.authorizationserver.client.ai-kyc-agent.token.access-token-time-to-live=15m

# Demo admin user for the frontend login flow (com.cddp.user.controller.AuthController).
# Phase-1 placeholder — replace with a real user store once the (currently
# empty) com.cddp.user package grows an actual User entity/table.
cddp.demo-admin.username=${DEMO_ADMIN_USERNAME:admin}
cddp.demo-admin.password=${DEMO_ADMIN_PASSWORD:changeme}
