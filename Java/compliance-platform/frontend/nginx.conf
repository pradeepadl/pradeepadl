server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the Spring Boot backend container.
    # The frontend still uses its own hardcoded mock data today (see App.tsx) —
    # this path is wired up ahead of time so real endpoints can be dropped in
    # under /api/** on the backend without touching the frontend's nginx config.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's build hashes these filenames per content, so they're safe to
    # cache indefinitely — a rebuild always produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any unmatched path falls back to index.html. Unlike
    # the hashed assets above, index.html's own name never changes between
    # deploys, so without this it's a prime target for the browser's
    # heuristic caching — leaving visitors stuck on a stale build (pointing
    # at asset hashes that no longer exist) until they hard-refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}