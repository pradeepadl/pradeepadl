server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the Spring Boot backend container.
    # The frontend still uses its own hardcoded mock data today (see App.tsx) —
    # this path is wired up ahead of time so real endpoints can be dropped in
    # under /api/** on the backend without touching the frontend's nginx config.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any unmatched path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}