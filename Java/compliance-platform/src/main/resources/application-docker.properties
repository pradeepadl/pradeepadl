# Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.deploy.yml).
#
# The plain compose.yaml / spring-boot-docker-compose combo is for local
# `./mvnw spring-boot:run` dev loops, where the plugin starts/stops those
# containers for you and wires connection details automatically. Once the app
# itself is packaged into a container as part of docker-compose.deploy.yml,
# that auto-wiring no longer applies (there's no local Docker socket handoff
# in the same sense), so this profile points at the same services by their
# compose service names instead.
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://postgres:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
# spring-boot-starter-batch needs its metadata tables; auto-init only kicks in
# for embedded DBs by default, and this is a real Postgres instance.
spring.batch.jdbc.initialize-schema=always

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

spring.neo4j.uri=bolt://neo4j:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=notverysecret